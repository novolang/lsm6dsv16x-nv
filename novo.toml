[package]
name        = "lsm6dsv16x-nv"
version     = "0.1.0"
description = "A driver for ST's LSM6DSV16X six-axis inertial module on an I2C or an SPI bus: the acceleration in milli-g and the rate of turn in milli-degrees per second at the range and rate set, the operating modes (high performance, high-accuracy ODR, low power), the data-ready pins, the FIFO in continuous mode with its tags, the sensor fusion low-power block's game rotation vector as a quaternion from the FIFO, the temperature, the self-tests and WHO_AM_I, as devices-nv's Accelerometer, Gyroscope, Imu, Thermometer and Identifiable."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["lsm6dsv16x", "imu", "accelerometer", "gyroscope", "sensor-fusion", "quaternion", "i2c", "spi", "sensor", "st", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/lsm6dsv16x-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.1"

# The package is checked at the embedded tier, the strictest one, so every
# function in it is also valid at rt and system.
[tier]
tier = "embedded"

[docs.pages]
"README.md" = "Reading an LSM6DSV16X six-axis IMU from a device program"

[dependencies]
# The board's I2C bus, SPI bus, GPIO and timer handles, and the I2cBus,
# SpiBus and GpioOut traits they implement.
# A path dependency until 0.4.0 is published: PATH-DEPENDENCIES.md in the
# parent directory lists the line that becomes "^0.4.0".
embedded-hal-nv = { path = "../embedded-hal-nv" }
# The wiring record a board's device table hands `attach`, the register
# helpers, and the Accelerometer, Gyroscope, Imu, Thermometer and
# Identifiable traits.
devices-nv      = { path = "../devices-nv" }
